<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Finca v0.23 (Prototyp)</title>
<!-- ab v0.9: eigenes kleines Symbol (Finca Haus mit Sonne), direkt als Bild im Text, keine Datei von aussen -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23b9a3f5'/%3E%3Ccircle cx='12' cy='4' r='2.2' fill='%23ffd36e'/%3E%3Cpath d='M2 8l6-5 6 5z' fill='%23e0785a'/%3E%3Crect x='3.5' y='8' width='9' height='6' fill='%23fff4dc'/%3E%3Crect x='7' y='10' width='2.4' height='4' fill='%238a5a3c'/%3E%3Cpath d='M5 9.4c.5-.6 1.3-.2 1 .5L5 11 4 9.9c-.3-.7.5-1.1 1-.5z' fill='%23ff7fa0'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #3a2e48; overflow: hidden; touch-action: manipulation; }
  /* ab v0.6: kein Markieren, keine Lupe beim langen Druecken, Platz fuer Notch und runde Ecken */
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #rahmen { position: relative; line-height: 0; box-shadow: 0 0 0 4px #b9a3f5, 0 8px 30px rgba(0,0,0,.45); border-radius: 6px; }
  canvas { display: block; }
  #spiel { image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui, #hud { position: absolute; left: 0; top: 0; pointer-events: none; }
  #hud { image-rendering: pixelated; image-rendering: crisp-edges; }
  #spiel { touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  /* Knoepfe (ab v0.3): Groesse folgt der Spielskalierung --s, auf dem Handy mindestens fingergross */
  .knopf { position: absolute; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; line-height: 1; }
  .knopf svg { width: 100%; height: 100%; display: block; }
  .knopf:focus-visible { outline: 3px solid #ffd36e; outline-offset: 1px; }
  #oben { position: absolute; top: calc(var(--s, 3) * 1px); right: calc(var(--s, 3) * 2px); display: flex; gap: calc(var(--s, 3) * 2px); }
  #oben .knopf { position: relative; width: max(26px, calc(var(--s, 3) * 9px)); height: max(26px, calc(var(--s, 3) * 9px));
    border-radius: 50%; background: #fff8ee; box-shadow: 0 0 0 2px #4a3560, 0 2px 0 2px rgba(58,42,78,.28); }
  /* auf Handy und Tablet sind die Knoepfe oben groesser (ab v0.6) */
  #rahmen.touch #oben .knopf { width: max(36px, calc(var(--s, 3) * 11px)); height: max(36px, calc(var(--s, 3) * 11px)); }
  /* ab v0.10: Elternbereich hinter dem kleinen, blassen Zahnrad. 3 Sekunden halten, ein Ring fuellt sich (--p von 0 bis 1) */
  #oben #eltern-knopf { width: max(22px, calc(var(--s, 3) * 6px)); height: max(22px, calc(var(--s, 3) * 6px)); align-self: center;
    background: #efe8f4; opacity: .55; box-shadow: 0 0 0 1px #8d7aa3; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: none; }
  #rahmen.touch #oben #eltern-knopf { width: max(28px, calc(var(--s, 3) * 7px)); height: max(28px, calc(var(--s, 3) * 7px)); }
  #eltern-knopf::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(#ffb037 calc(var(--p, 0) * 360deg), transparent 0);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 64%); mask: radial-gradient(circle, transparent 62%, #000 64%); }
  #eltern-knopf svg { position: relative; }
  /* ab v0.10: weniger Bewegung (Elternbereich): keine wackelnden oder pulsierenden Knoepfe */
  #rahmen.ruhig *, #rahmen.ruhig *::after { animation: none !important; }
  /* ab v0.12: solange der Elternbereich offen ist, sind die Knoepfe oben rechts weg (am Handy lagen sie ueber dem X) */
  #rahmen.eltern #oben { visibility: hidden; }
  /* ab v0.18: Aktionsknopf / Joystick nicht ueber Bildkarten (schluckte Tips auf Schlafenszeit) */
  #rahmen.wahl #touch, #rahmen.wahl #knopf-aktion { visibility: hidden !important; pointer-events: none !important; opacity: 0 !important; }
  /* ab v0.9: Bilderbuch, ein roter Punkt zeigt einen neuen Sticker */
  #buch-knopf { background: #e6f7f3; }
  #buch-knopf.neu::after { content: ""; position: absolute; right: -2px; top: -2px; width: 34%; height: 34%; border-radius: 50%;
    background: #ff6f91; box-shadow: 0 0 0 2px #4a3560; animation: punkt 1.2s ease-in-out infinite; }
  @keyframes punkt { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { #buch-knopf.neu::after { animation: none; } }
  #ton-knopf .an { display: block; } #ton-knopf .weg { display: none; }
  #ton-knopf.aus .an { display: none; } #ton-knopf.aus .weg { display: block; }
  #ton-knopf.aus { background: #e3dbea; }
  /* ab v0.8: ein grosser Aktionsknopf unten rechts. Bild und Randfarbe zeigen, was er gerade tut:
     Gast tuerkis, Herd rosa, Pflanze gruen, Tier und Ei pink, neuer Tag gelb. Ohne Ziel ist er nicht da. */
  #touch { display: none; position: absolute; right: calc(var(--s, 3) * 4px); bottom: calc(var(--s, 3) * 4px); }
  #rahmen.touch #touch { display: block; }
  #knopf-aktion { position: relative; width: max(76px, calc(var(--s, 3) * 26px)); height: max(76px, calc(var(--s, 3) * 26px));
    border-radius: 50%; background: #fff8ee; --rand: #5ec8b8; --lippe: #3fa597;
    box-shadow: 0 0 0 3px #4a3560, inset 0 0 0 6px var(--rand), 0 5px 0 3px var(--lippe);
    transition: opacity .18s ease; opacity: 0.96; }
  #knopf-aktion svg { width: 56%; height: 56%; margin: 0 auto; display: none; }
  #knopf-aktion[data-art="reden"] .i-reden, #knopf-aktion[data-art="streicheln"] .i-streicheln, #knopf-aktion[data-art="fuettern"] .i-fuettern,
  #knopf-aktion[data-art="ernten"] .i-ernten, #knopf-aktion[data-art="sammeln"] .i-sammeln, #knopf-aktion[data-art="kochen"] .i-kochen,
  #knopf-aktion[data-art="weiter"] .i-weiter, #knopf-aktion[data-art="musik"] .i-musik,
  #knopf-aktion[data-art="schoepfen"] .i-schoepfen, #knopf-aktion[data-art="ballon"] .i-ballon,
  #knopf-aktion[data-art="landen"] .i-landen, #knopf-aktion[data-art="aussteigen"] .i-aussteigen,
  #knopf-aktion[data-art="boot"] .i-boot, #knopf-aktion[data-art="flamingo"] .i-flamingo,
  #knopf-aktion[data-art="absteigen"] .i-absteigen { display: block; }
  #knopf-aktion.art-reden { --rand: #5ec8b8; --lippe: #3fa597; }
  #knopf-aktion.art-kochen { --rand: #ff8f8f; --lippe: #e06a6a; }
  #knopf-aktion.art-ernten { --rand: #7ed492; --lippe: #56b06c; }
  #knopf-aktion.art-streicheln, #knopf-aktion.art-fuettern, #knopf-aktion.art-sammeln { --rand: #ff9fc0; --lippe: #e07aa0; }
  #knopf-aktion.art-weiter { --rand: #ffd36e; --lippe: #e0ad3e; }
  #knopf-aktion.art-musik { --rand: #ffb037; --lippe: #d98a1c; }
  #knopf-aktion.art-schoepfen { --rand: #7ec8e3; --lippe: #4aa0c0; }
  #knopf-aktion.art-ballon, #knopf-aktion.art-landen { --rand: #ff6b8a; --lippe: #e04a6a; }
  #knopf-aktion.art-boot, #knopf-aktion.art-aussteigen { --rand: #f0b27a; --lippe: #d08a4a; }
  #knopf-aktion.art-flamingo, #knopf-aktion.art-absteigen { --rand: #ff9fb8; --lippe: #e07a9a; }
  #knopf-aktion.leer { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(0.6); transition: opacity .18s ease, transform .18s ease, visibility 0s .18s; }
  /* ab v0.17: auf Touch bleibt der leere Knopf leicht tippbar (Rückmeldung statt „tot“) */
  #rahmen.touch #knopf-aktion.leer, html.mobil #knopf-aktion.leer {
    opacity: 0.32; visibility: visible; pointer-events: auto; transform: scale(0.92);
  }
  #knopf-aktion.wackel { animation: knopfWackel .16s ease-in-out; }
  @keyframes knopfWackel { 0%, 100% { transform: translateX(0) scale(0.92); } 30% { transform: translateX(-3px) scale(0.92); } 70% { transform: translateX(3px) scale(0.92); } }
  @media (prefers-reduced-motion: reduce) { #knopf-aktion.wackel { animation: none; } }
  #knopf-aktion:active { transform: translateY(4px); box-shadow: 0 0 0 3px #4a3560, inset 0 0 0 6px var(--rand), 0 1px 0 3px var(--lippe); }
  #knopf-aktion.pop { animation: pop .28s ease-out; } #knopf-aktion.pop2 { animation: pop2 .28s ease-out; }
  #knopf-aktion.puls.pop, #knopf-aktion.puls.pop2 { animation: pop .28s ease-out, puls 1.6s ease-in-out .3s infinite; }
  @keyframes pop { 0% { transform: scale(0); } 65% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes pop2 { 0% { transform: scale(0); } 65% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes puls { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @media (max-height: 430px) {
    #rahmen.touch #knopf-aktion { width: max(64px, calc(var(--s, 3) * 24px)); height: max(64px, calc(var(--s, 3) * 24px)); }
  }
  @media (prefers-reduced-motion: reduce) { #knopf-aktion.pop, #knopf-aktion.pop2, #knopf-aktion.puls.pop, #knopf-aktion.puls.pop2 { animation: none; } }
  /* ab v0.8: Vorlesen an oder aus. Grau, wenn der Ton aus ist (dann wird auch nicht vorgelesen) */
  #vorlesen-knopf { background: #e8f7f3; }
  #vorlesen-knopf .an { display: block; } #vorlesen-knopf .weg { display: none; }
  #vorlesen-knopf.aus .an { display: none; } #vorlesen-knopf.aus .weg { display: block; }
  #vorlesen-knopf.aus, #vorlesen-knopf.stumm { background: #e3dbea; }
  #vorlesen-knopf.stumm svg { opacity: .55; }
  /* ab v0.15/v0.16: Hochformat-Tipp nur bei .mobil.quer (JS). Desktop nie. Spiel bleibt unter dem Tip sichtbar (abgedunkelt). */
  #hinweis { display: none; position: fixed; inset: 0; z-index: 20; text-align: center; color: #fff4dc;
    font: bold 15px "Trebuchet MS", Verdana, sans-serif; line-height: 1.3;
    background: rgba(58,46,72,.82); align-items: center; justify-content: center; flex-direction: column;
    pointer-events: none; }
  #hinweis svg { width: 64px; height: 64px; display: block; margin: 0 auto 8px; animation: aufrichten 2.4s ease-in-out infinite; }
  @keyframes aufrichten { 0%, 25% { transform: rotate(90deg); } 55%, 85% { transform: rotate(0deg); } 100% { transform: rotate(90deg); } }
  html.mobil.quer #hinweis { display: flex; }
  /* Spiel bleibt sichtbar (abgedunkelt), damit Hochkant-Wechsel ohne Reload weitergeht */
  html.mobil.quer #rahmen { filter: brightness(0.35); }
  @media (prefers-reduced-motion: reduce) { #hinweis svg { animation: none; transform: rotate(0deg); } }
  /* ab v0.18: echtes logisches Hochformat (320×400) — Canvas fuellt Hochkant, kein Letterbox-Quer */
  html.mobil #rahmen { max-width: 100vw; max-height: 100vh; }
  html.mobil #oben {
    top: calc(var(--s, 3) * 2px + env(safe-area-inset-top, 0px));
    right: calc(var(--s, 3) * 3px + env(safe-area-inset-right, 0px));
    flex-direction: column; align-items: flex-end; gap: calc(var(--s, 3) * 2px);
    max-width: none;
  }
  /* ab v0.16: unsichtbare Trefferzone um die oberen Knoepfe (~44px fuer Kinderfinger) */
  html.mobil #oben .knopf { position: relative; }
  html.mobil #oben .knopf::before { content: ""; position: absolute; inset: -8px; }
  /* Querformat-Tipp schluckt keine Tips (Zahnrad/Mute bleiben erreichbar) */
  html.mobil.quer #oben { z-index: 30; filter: none; }
  /* ab v0.11: Sicherung als Code (nur im Elternbereich). Normale Schrift des Geraets, keine Schrift von aussen */
  #sicherung { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(58,44,80,.55);
    line-height: 1.35; font: 14px ui-rounded, "Trebuchet MS", system-ui, sans-serif; color: #4b3a5a; -webkit-user-select: text; user-select: text; }
  #sicherung[hidden] { display: none; }
  #sicherung .karte { background: #fff8ee; border-radius: 10px; box-shadow: 0 0 0 3px #4a3560; padding: 12px 14px; width: min(92%, 560px); max-height: 92%; overflow: auto; box-sizing: border-box; }
  #sicherung h2 { margin: 0 0 6px; font-size: 16px; }
  #sicherung p { margin: 4px 0; font-size: 12px; }
  #sicherung textarea { width: 100%; box-sizing: border-box; height: 56px; font: 11px ui-monospace, monospace; border: 2px solid #c9bcd8; border-radius: 6px; padding: 4px; resize: none; background: #fff; color: #4b3a5a; }
  #sicherung .reihe { display: flex; gap: 8px; margin: 6px 0 8px; flex-wrap: wrap; }
  #sicherung button { font: bold 13px ui-rounded, "Trebuchet MS", system-ui, sans-serif; border: 0; border-radius: 8px; padding: 8px 12px; background: #e6defb; color: #4b3a5a; box-shadow: 0 0 0 2px #4a3560; cursor: pointer; }
  #sicherung button:focus-visible { outline: 3px solid #ffd36e; }
  #sicherung #sicherung-zu { background: #ffd1e0; }
  #sicherung .meldung { min-height: 1.3em; font-weight: bold; }
</style>
</head>
<body>
<div id="rahmen">
  <canvas id="spiel" width="320" height="176"></canvas>
  <canvas id="hud" width="320" height="176" style="display:none"></canvas>
  <canvas id="ui" width="320" height="176"></canvas>
  <div id="oben">
    <button id="buch-knopf" class="knopf" type="button" title="Bilderbuch: Rezepte und Sticker (Taste B)" aria-label="Bilderbuch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C9.8 5 7 4.6 3.5 5v13c3.5-.4 6.3 0 8.5 1.5 2.2-1.5 5-1.9 8.5-1.5V5C17 4.6 14.2 5 12 6.5z" fill="#ffffff" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.5v13" stroke="#4b3a5a" stroke-width="2"/><circle cx="7.6" cy="11" r="2" fill="#ff9fb8"/><path d="M16.3 8.6l.8 1.7 1.8.2-1.3 1.2.4 1.8-1.7-.9-1.6.9.3-1.8-1.3-1.2 1.8-.2z" fill="#ffd36e" stroke="#4b3a5a" stroke-width=".8" stroke-linejoin="round"/></svg>
    </button>
    <button id="vorlesen-knopf" class="knopf" type="button" title="Sprechblasen vorlesen an oder aus" aria-label="Vorlesen ausschalten" style="display:none">
      <svg class="an" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="10" r="5" fill="#ffe0c2" stroke="#4b3a5a" stroke-width="2"/><path d="M6.5 15.5c-2 .8-3 2.5-3 4.5h11c0-2-1-3.7-3-4.5" fill="#5ec8b8" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><path d="M16.5 7.5c1.2 1.4 1.2 3.6 0 5M19 5.5c2.3 2.6 2.3 6.4 0 9" fill="none" stroke="#4b3a5a" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="weg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="10" r="5" fill="#e3dbea" stroke="#4b3a5a" stroke-width="2"/><path d="M6.5 15.5c-2 .8-3 2.5-3 4.5h11c0-2-1-3.7-3-4.5" fill="#c9bcd8" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><path d="M16 7l5 6M21 7l-5 6" fill="none" stroke="#4b3a5a" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="ton-knopf" class="knopf" type="button" title="Musik und Ton an oder aus (Taste M)" aria-label="Ton ausschalten">
      <svg class="an" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#ff9fb8" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><path d="M16 9c1.3 1.6 1.3 4.4 0 6M18.5 6.5c2.8 3 2.8 8 0 11" fill="none" stroke="#4b3a5a" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="weg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#c9bcd8" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="#4b3a5a" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="vollbild-knopf" class="knopf" type="button" title="Vollbild an oder aus" aria-label="Vollbild">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#4b3a5a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="eltern-knopf" class="knopf" type="button" title="Für Eltern: 3 Sekunden gedrückt halten" aria-label="Für Eltern, 3 Sekunden gedrückt halten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.5h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9-2.6-.5v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8z" fill="#ffffff" stroke="#6b5a7d" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="#efe8f4" stroke="#6b5a7d" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div id="sicherung" hidden role="dialog" aria-modal="true" aria-labelledby="sicherung-titel">
    <div class="karte">
      <h2 id="sicherung-titel">Sichern und übertragen</h2>
      <p>Dieser Code enthält die Spielstände, Sticker und Einstellungen aller Bilder. Die Spielzeit von heute ist nicht dabei.</p>
      <textarea id="sicherung-code" readonly aria-label="Sicherungscode"></textarea>
      <div class="reihe"><button id="sicherung-kopieren" type="button">Code kopieren</button></div>
      <p>Auf einem anderen Gerät: Code hier einfügen und übernehmen. Der Stand auf diesem Gerät wird dabei ersetzt.</p>
      <textarea id="sicherung-einfuegen" aria-label="Code einfügen" placeholder="FINCA1-..."></textarea>
      <div class="reihe"><button id="sicherung-laden" type="button">Übernehmen</button><button id="sicherung-zu" type="button">Schließen</button></div>
      <p id="sicherung-meldung" class="meldung" aria-live="polite"></p>
    </div>
  </div>
  <div id="touch">
    <button id="knopf-aktion" class="knopf leer" type="button" aria-label="Gerade nichts zu tun" data-art="">
      <svg class="i-reden" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#ffffff" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="10.5" r="1.3" fill="#4b3a5a"/><circle cx="12" cy="10.5" r="1.3" fill="#4b3a5a"/><circle cx="16" cy="10.5" r="1.3" fill="#4b3a5a"/></svg>
      <svg class="i-streicheln" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.5A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.5C19 15.6 12 20 12 20z" fill="#ff9fc0" stroke="#4b3a5a" stroke-width="2" stroke-linejoin="round"/><path d="M9 10.5a1.6 1.6 0 0 1 2-1" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/></svg>
